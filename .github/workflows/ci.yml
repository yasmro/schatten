name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome CI
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm vitest run

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `size-limit` measures files in dist/, so the package must be built
      # first. build:css relies on lightningcss-cli's postinstall binary —
      # enabled via pnpm.onlyBuiltDependencies in package.json.
      - name: Build
        run: pnpm build

      # andresz1/size-limit-action was evaluated for its PR size-diff comment
      # but it prunes devDependencies before measuring, which drops size-limit
      # itself; it is also pinned to a deprecated Node 20 runtime. A plain
      # `pnpm size` gate is reliable and fails the check on any budget breach.
      - name: Check bundle size
        run: pnpm size

  changeset:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Changeset status
        # Compare against the PR's base branch (develop / main), not a fixed
        # branch — otherwise a develop-targeted PR is diffed against main and
        # picks up unrelated already-merged changesets once the two diverge.
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}
