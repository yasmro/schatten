name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome CI
        run: pnpm lint

      # README's "Available components" list is derived from
      # `src/components/lv1/`. A new lv1 added without re-running
      # `pnpm sync:readme` is an invisible consumer-facing gap — this gate
      # surfaces the drift in the PR's checks list. No build required:
      # the script only reads the lv1 directories and the README.
      - name: README components drift
        run: pnpm check:readme

      # Catches drift between `.claude/rules/css-api.md` §`@layer order` and
      # `src/styles/entry.css` — exactly the kind of doc-vs-implementation
      # mismatch that hid the preflight-priority bug fixed in #277. Runs in
      # the `lint` job because it has no build dependency.
      - name: CSS @layer order drift
        run: pnpm check:layer-order

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm vitest run

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `size-limit` measures files in dist/, so the package must be built
      # first. build:css now runs `@tailwindcss/cli` against
      # `src/styles/entry.css` (no native postinstall step required).
      - name: Build
        run: pnpm build

      # andresz1/size-limit-action was evaluated for its PR size-diff comment
      # but it prunes devDependencies before measuring, which drops size-limit
      # itself; it is also pinned to a deprecated Node 20 runtime. A plain
      # `pnpm size` gate is reliable and fails the check on any budget breach.
      - name: Check bundle size
        run: pnpm size

  manifest:
    runs-on: ubuntu-latest
    # Skipped on the develop→main release PR for the same reason as
    # `changeset`: `changeset version` consumes every changeset, so the
    # diff-needs-changeset heuristic in scripts/check-manifest-diff.mjs
    # produces a misleading error. Dependabot bumps cannot meaningfully
    # change the CSS surface either.
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref != 'main' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # `changeset status --since=origin/<base>` needs full history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The manifest is generated from dist/schatten.css, so the package
      # must be built before the gate can compare against the committed
      # snapshot. `size` runs an independent build for an independent
      # check; the two are kept as separate jobs so a failure on either
      # is immediately distinguishable in the PR's checks list.
      - name: Build
        run: pnpm build
      - name: Check manifest diff
        run: pnpm check:manifest
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  changeset:
    runs-on: ubuntu-latest
    # Skipped on the develop→main release PR: that PR has consumed every
    # changeset via `changeset version`, so a "no changeset found" failure is
    # expected, not a mistake. The check guards feature PRs (base = develop).
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref != 'main' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Changeset status
        # Compare against the PR's base branch (develop / main), not a fixed
        # branch — otherwise a develop-targeted PR is diffed against main and
        # picks up unrelated already-merged changesets once the two diverge.
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

  audit:
    runs-on: ubuntu-latest
    # Phase 1: observe-only. continue-on-error keeps the check from blocking
    # merges while we watch the real-world failure rate over ~1 week of PRs
    # (see #307 staged rollout). Phase 2 removes this line and adds `audit`
    # to develop's required checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # No `pnpm install` step: scripts/audit-coverage.mjs imports only
      # `node:fs` / `node:path` (zero external deps, no compile step), so
      # `pnpm audit:coverage` resolves to a bare `node` run that needs no
      # node_modules. Skipping install (and the `cache: pnpm` it would feed)
      # keeps this the cheapest job in CI. pnpm/action-setup is still needed
      # to provide the `pnpm` binary that runs the package.json script.
      #
      # `audit:coverage` reads the lv1 tree only — no build, no git history
      # needed (unlike `manifest` / `changeset`), and no dependabot / base=main
      # skip because the result is deterministic on source: a dep bump or the
      # release PR leaves lv1 dirs untouched, so the gate just passes. The
      # script writes the full markdown report to stdout *before* exiting 1 on
      # a gap, so piping into $GITHUB_STEP_SUMMARY surfaces the "Missing files"
      # + "Recommended actions" sections directly in the PR's checks summary.
      # `set -o pipefail` is REQUIRED — without it the pipe's exit code is
      # tee's (0) and a real gap is silently swallowed.
      - name: lv1 companion coverage
        shell: bash
        run: |
          set -o pipefail
          pnpm audit:coverage --check | tee -a "$GITHUB_STEP_SUMMARY"

  a11y:
    runs-on: ubuntu-latest
    # Phase 1: observe-only. The a11y assertions in *.vrt.spec.ts run axe
    # (WCAG 2.1 A/AA) against every lv1 story × theme, but ~115 pre-existing
    # violations (systemic borderline color-contrast on state tokens, plus
    # bare-control story artifacts) cannot be fixed inside this infra PR
    # without a designer-owned token retune or a story-relabel + VRT
    # re-baseline. So this gate observes — the step tees the axe output into
    # the job summary so the violation list is readable from the PR checks
    # without blocking merges — mirroring the staged rollout of the `audit`
    # job (#307). Fixes land as follow-up issues (#344 / #345); Phase 2 (#346)
    # removes continue-on-error and adds `a11y` to develop's required checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium

      # No `pnpm build` step: the a11y tests target Storybook (the `pnpm dev`
      # webServer in playwright.config.ts), not dist/ — only CSSApiDist (a VRT
      # spec, excluded by the `a11y` grep) reads dist directly. axe is run on
      # ubuntu rather than the scarce macos VRT runner because contrast/role
      # checks derive from CSS, not from macos font / sub-pixel rendering.
      # Tee axe output into the job summary so the violation list is readable
      # straight from the PR checks (the `audit` job does the same for coverage
      # gaps). GitHub's default bash shell runs with `-e`, so capture the
      # Playwright exit code under `set +e` before doing anything else.
      #
      # Phase 1 observe-only contract: ~115 known violations make Playwright
      # exit non-zero on EVERY run, so propagating that status would paint the
      # `a11y` check permanently red and train people to ignore it (unlike the
      # `audit` job, which is green until a real new gap appears). Instead we
      # keep the check GREEN as long as axe actually ran — a Playwright result
      # summary line (`N passed` / `N failed`) proves the suite executed — and
      # only fail the step when axe could NOT run (crash, or the `--`/grep
      # mistake that yields "No tests found"). #346 (Phase 2) deletes this
      # exit-0 shim together with `continue-on-error` to make the gate block.
      - name: a11y (axe) checks
        shell: bash
        run: |
          {
            echo '## a11y (axe) — WCAG 2.1 A/AA (Phase 1 observe-only)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          pnpm test:a11y 2>&1 | tee axe-out.txt
          status=${PIPESTATUS[0]}
          set -e
          cat axe-out.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if grep -qE '[0-9]+ (passed|failed)' axe-out.txt; then
            echo 'a11y ran (Phase 1 observe-only): violations are listed in the job summary, not blocking.'
            exit 0
          fi
          echo '::error::axe did not run (no Playwright result summary) — failing the step.'
          exit "$status"
