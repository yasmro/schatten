name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome CI
        run: pnpm lint

      # README's "Available components" list is derived from
      # `src/components/lv1/`. A new lv1 added without re-running
      # `pnpm sync:readme` is an invisible consumer-facing gap — this gate
      # surfaces the drift in the PR's checks list. No build required:
      # the script only reads the lv1 directories and the README.
      - name: README components drift
        run: pnpm check:readme

      # Catches drift between `.claude/rules/css-api.md` §`@layer order` and
      # `src/styles/entry.css` — exactly the kind of doc-vs-implementation
      # mismatch that hid the preflight-priority bug fixed in #277. Runs in
      # the `lint` job because it has no build dependency.
      - name: CSS @layer order drift
        run: pnpm check:layer-order

      # The JP/EN `font-size-adjust` compensation (#184) lives on the `body`
      # reset, duplicated in `entry.css` (dist) and `globals.css` (Storybook).
      # If they drift, Storybook/VRT stays green while shipped dist differs —
      # a silent visual regression no other gate catches. No build dependency.
      - name: body reset font-size-adjust sync
        run: pnpm check:body-reset

      # #317 — every public-vocabulary var() consumed by the dist CSS chain
      # must have a row in the hand-maintained registrar (public-tokens.css)
      - name: Check registrar sync (public CSS variables)
        run: pnpm check:registrar

      # Relative links + heading anchors in docs/**/*.md + README + the three
      # root entry-point docs (AGENTS / CLAUDE / CONTRIBUTING) must resolve.
      # A heading rename in a rule doc would otherwise silently dead-link the
      # migration guide (#157) and other prose. No build dependency.
      - name: Doc link health
        run: pnpm check:doc-links

      # GitHub issue forms are validated only at new-issue render time, so a
      # malformed template ships silently. Structural check of the required
      # top-level keys + file presence (#159). No build dependency.
      - name: Issue / PR template health
        run: pnpm check:issue-templates

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm vitest run

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `size-limit` measures files in dist/, so the package must be built
      # first. build:css runs lightningcss (scripts/build-css.mjs) against
      # `src/styles/entry.css` (no native postinstall step required).
      - name: Build
        run: pnpm build

      # andresz1/size-limit-action was evaluated for its PR size-diff comment
      # but it prunes devDependencies before measuring, which drops size-limit
      # itself; it is also pinned to a deprecated Node 20 runtime. A plain
      # `pnpm size` gate is reliable and fails the check on any budget breach.
      - name: Check bundle size
        run: pnpm size

  manifest:
    runs-on: ubuntu-latest
    # Skipped on the develop→main release PR for the same reason as
    # `changeset`: `changeset version` consumes every changeset, so the
    # diff-needs-changeset heuristic in scripts/check-manifest-diff.mjs
    # produces a misleading error. Dependabot bumps cannot meaningfully
    # change the CSS surface either.
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref != 'main' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # `changeset status --since=origin/<base>` needs full history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The manifest is generated from dist/schatten.css, so the package
      # must be built before the gate can compare against the committed
      # snapshot. `size` runs an independent build for an independent
      # check; the two are kept as separate jobs so a failure on either
      # is immediately distinguishable in the PR's checks list.
      - name: Build
        run: pnpm build
      - name: Check manifest diff
        run: pnpm check:manifest
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
      # Resolve the manifest through package.json#exports and assert the dist
      # copy is valid + introspectable (4 surface keys, dist-only
      # package/version/generatedAt present, surface == committed snapshot).
      # publint proves the export target exists; this proves it resolves and
      # parses — the "a consumer can actually import it" half of the contract.
      - name: Check manifest export
        run: pnpm check:manifest:export

  changeset:
    runs-on: ubuntu-latest
    # Skipped on the develop→main release PR: that PR has consumed every
    # changeset via `changeset version`, so a "no changeset found" failure is
    # expected, not a mistake. The check guards feature PRs (base = develop).
    if: |
      github.event_name == 'pull_request' &&
      github.base_ref != 'main' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Changeset status
        # Compare against the PR's base branch (develop / main), not a fixed
        # branch — otherwise a develop-targeted PR is diffed against main and
        # picks up unrelated already-merged changesets once the two diverge.
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

  audit:
    runs-on: ubuntu-latest
    # Phase 2 (blocking). The Phase-1 observe window (#307) is over: every lv1
    # currently passes `pnpm audit:coverage --check`, so the gate now blocks —
    # a missing required companion (test / VRT spec / class-API CSS /
    # __snapshots__ baseline / index.ts re-export, plus the parity series for
    # classification A/B) fails the PR. The step already exits 1 on a gap via
    # `set -o pipefail`; dropping `continue-on-error` lets that surface as a red
    # check. Adding `audit` to develop's required checks is a repo-settings
    # change (ruleset), tracked alongside #346, not in this workflow.
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # No `pnpm install` step: scripts/audit-coverage.mjs imports only
      # `node:fs` / `node:path` (zero external deps, no compile step), so
      # `pnpm audit:coverage` resolves to a bare `node` run that needs no
      # node_modules. Skipping install (and the `cache: pnpm` it would feed)
      # keeps this the cheapest job in CI. pnpm/action-setup is still needed
      # to provide the `pnpm` binary that runs the package.json script.
      #
      # `audit:coverage` reads the lv1 tree only — no build, no git history
      # needed (unlike `manifest` / `changeset`), and no dependabot / base=main
      # skip because the result is deterministic on source: a dep bump or the
      # release PR leaves lv1 dirs untouched, so the gate just passes. The
      # script writes the full markdown report to stdout *before* exiting 1 on
      # a gap, so piping into $GITHUB_STEP_SUMMARY surfaces the "Missing files"
      # + "Recommended actions" sections directly in the PR's checks summary.
      # `set -o pipefail` is REQUIRED — without it the pipe's exit code is
      # tee's (0) and a real gap is silently swallowed.
      - name: lv1 companion coverage
        shell: bash
        run: |
          set -o pipefail
          pnpm audit:coverage --check | tee -a "$GITHUB_STEP_SUMMARY"

  a11y:
    runs-on: ubuntu-latest
    # Phase 2 (#346): blocking. The a11y assertions in *.vrt.spec.ts run axe
    # (WCAG 2.1 A/AA) against every lv1 story × theme and must report zero
    # violations. The Phase 1 backlog is cleared — color-contrast (#344, the
    # state-token `emphasis` retune in Phase B) and label/button-name (#345)
    # are fixed; the only remaining axe `color-contrast` findings are intentional
    # design exceptions (solid treatments / inverted-on-saturated / the
    # foreground-subtle tertiary tier — see state-token-guideline.md), each
    # disabled with a documented rationale scoped to its own story in the VRT
    # spec + mirrored in `parameters.a11y`; ditto the documented
    # `aria-hidden-focus` disables on open Radix poppers (Select /
    # DropdownMenu / Popover — see vrt-spec-guideline.md §a11y assertions).
    # So the gate now propagates the
    # Playwright exit code (a new violation fails the PR). Adding `a11y` to
    # develop's required checks is a repo-settings change (ruleset), tracked in
    # #346, not in this workflow.
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium

      # No `pnpm build` step: the a11y tests target Storybook (the `pnpm dev`
      # webServer in playwright.config.ts), not dist/ — only CSSApiDist (a VRT
      # spec, excluded by the `a11y` grep) reads dist directly. axe is run on
      # ubuntu rather than the scarce macos VRT runner because contrast/role
      # checks derive from CSS, not from macos font / sub-pixel rendering.
      #
      # The axe output is still tee'd into the job summary so a failure's
      # violation list is readable straight from the PR checks (the `audit` job
      # does the same for coverage gaps). GitHub's default bash runs with `-e`,
      # which would abort the step before the summary is written, so the
      # Playwright exit code is captured under `set +e` via `PIPESTATUS[0]` and
      # re-raised after the closing fence — the step fails iff axe reports a
      # violation (Phase 2 blocking, #346).
      - name: a11y (axe) checks
        shell: bash
        run: |
          {
            echo '## a11y (axe) — WCAG 2.1 A/AA'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          pnpm test:a11y 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
