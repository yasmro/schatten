name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable -> storybook/ (released), next -> storybook/next/ (develop)'
        type: choice
        options: [stable, next]
        default: stable

permissions:
  contents: write

# gh-pages に書く workflow は全て同一グループで直列化する。JamesIves の deploy は
# 実行開始時点の gh-pages を base に force-push するため、並走すると後着が先着の
# コミットを黙って巻き戻す(#502 の切替作業で 2 回実測: cannot-lock-ref 失敗と、
# force-push による site 更新の消失)。cancel はせず順番待ちにする。
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Resolve where this build is published, based on the pushed ref (#502 —
      # the Pages root belongs to nobody; it carries only the router page that
      # deploy-site.yml owns):
      #   main    -> /storybook/       — released, what the docs site links to
      #   develop -> /storybook/next/  — unreleased integration preview
      - name: Resolve deploy target
        id: target
        # push: channel follows the ref (develop -> next, main -> stable).
        # workflow_dispatch: the channel INPUT decides — needed because a
        # dispatch runs the workflow definition of its ref, so the first
        # stable deploy after #502 must be runnable from develop (main only
        # picks up this file at the next release).
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            CHANNEL="next"
          else
            CHANNEL="stable"
          fi
          if [ "$CHANNEL" = "next" ]; then
            {
              echo "base=/schatten/storybook/next/"
              echo "channel=next"
              echo "target-folder=storybook/next"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "base=/schatten/storybook/"
              echo "channel=stable"
              echo "target-folder=storybook"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        env:
          STORYBOOK_BASE: ${{ steps.target.outputs.base }}
          STORYBOOK_CHANNEL: ${{ steps.target.outputs.channel }}
        run: pnpm build:storybook

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: storybook-static
          # main -> storybook/; develop -> storybook/next/ (#502)
          target-folder: ${{ steps.target.outputs.target-folder }}
          clean: true
          # clean-exclude is relative to target-folder: the main deploy
          # (storybook/) must not wipe the develop build at storybook/next/.
          # The develop deploy targets storybook/next/ itself, where the
          # exclude simply matches nothing.
          clean-exclude: |
            next
