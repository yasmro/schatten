name: Storybook Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Preview mirrors the production directory split (#449): the two
      # surfaces live side by side under named directories —
      #   pr/<n>/site/       docs site
      #   pr/<n>/storybook/  Storybook
      #   pr/<n>/            a router page (below) — the same shape the
      #                      production Pages root will take, so the preview
      #                      doubles as its prototype.
      - name: Build Storybook
        env:
          STORYBOOK_BASE: /schatten/pr/${{ github.event.pull_request.number }}/storybook/
        run: pnpm build:storybook

      - name: Build library (dist the docs site consumes)
        run: pnpm build

      - name: Build docs site
        env:
          DOCS_BASE: /schatten/pr/${{ github.event.pull_request.number }}/site/
        run: pnpm --filter schatten-docs build

      - name: Assemble preview (site/ + storybook/ + router index)
        run: |
          mkdir -p preview-dist/storybook preview-dist/site
          cp -r storybook-static/. preview-dist/storybook/
          cp -r apps/docs/dist/. preview-dist/site/
          # Router: old-style Storybook deep links carry ?path= — send them to
          # storybook/, everyone else to site/. <noscript> falls back to site/.
          cat > preview-dist/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Schatten</title>
          <script>
            var q = location.search;
            location.replace(q.indexOf('path=') !== -1 ? 'storybook/' + q : 'site/');
          </script>
          <noscript><meta http-equiv="refresh" content="0; url=site/"></noscript>
          HTML

      - name: Deploy preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: preview-dist
          target-folder: pr/${{ github.event.pull_request.number }}
          clean: true

      - name: Find existing comment
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- storybook-preview -->"

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- storybook-preview -->
            📖 **Preview**

            | | |
            |---|---|
            | 🌐 Docs site | https://yasmro.github.io/schatten/pr/${{ github.event.pull_request.number }}/site/ |
            | 📖 Storybook | https://yasmro.github.io/schatten/pr/${{ github.event.pull_request.number }}/storybook/ |

            _Updated for commit ${{ github.event.pull_request.head.sha }}_

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "pr/${{ github.event.pull_request.number }}" ]; then
            git rm -rf "pr/${{ github.event.pull_request.number }}"
            git commit -m "chore: remove storybook preview for PR #${{ github.event.pull_request.number }}"
            git push
          fi
