name: Storybook Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: write

# gh-pages に書く workflow は全て同一グループで直列化する。JamesIves の deploy は
# 実行開始時点の gh-pages を base に force-push するため、並走すると後着が先着の
# コミットを黙って巻き戻す(#502 の切替作業で 2 回実測: cannot-lock-ref 失敗と、
# force-push による site 更新の消失)。cancel はせず順番待ちにする。
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Preview mirrors the production directory split (#449 / #502):
      #   pr/<n>/storybook/  Storybook
      #   pr/<n>/            the production router page (below)
      # The public site lives in yasmro/schatten-site since #563, so there is
      # no site build to preview here; the router sends non-`?path=` visitors
      # to the production schatten-site.
      - name: Build Storybook
        env:
          STORYBOOK_BASE: /schatten/pr/${{ github.event.pull_request.number }}/storybook/
        run: pnpm build:storybook

      - name: Assemble preview (storybook/ + router index)
        run: |
          mkdir -p preview-dist/storybook
          cp -r storybook-static/. preview-dist/storybook/
          # Router page — the SAME file production deploys to the Pages root
          # (deploy-pages-root.yml), so the preview tree mirrors production.
          cp .github/pages-root/index.html preview-dist/index.html

      - name: Deploy preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: preview-dist
          target-folder: pr/${{ github.event.pull_request.number }}
          clean: true

      - name: Find existing comment
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- storybook-preview -->"

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- storybook-preview -->
            📖 **Preview**

            | | |
            |---|---|
            | 📖 Storybook | https://yasmro.github.io/schatten/pr/${{ github.event.pull_request.number }}/storybook/ |

            _Updated for commit ${{ github.event.pull_request.head.sha }}_

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "pr/${{ github.event.pull_request.number }}" ]; then
            git rm -rf "pr/${{ github.event.pull_request.number }}"
            git commit -m "chore: remove storybook preview for PR #${{ github.event.pull_request.number }}"
            git push
          fi
