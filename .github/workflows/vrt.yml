name: VRT

on:
  pull_request:
    branches: [main, develop]

# Cancel a superseded VRT run when new commits land on the same PR — otherwise
# the obsolete runs keep sitting in the scarce macos-latest runner queue.
concurrency:
  group: vrt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vrt:
    runs-on: macos-latest
    # Healthy runs finish in ~8 min. A render-time crash (e.g. an empty
    # #storybook-root) makes every test burn its full timeout × retries and
    # can otherwise occupy the runner for 2h+ — fail fast instead.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium

      - run: pnpm test:vrt
        id: vrt

      - uses: actions/upload-artifact@v7
        if: failure() && steps.vrt.outcome == 'failure'
        id: artifact
        with:
          name: vrt-diff
          path: test-results/
          retention-days: 7

      - uses: actions/github-script@v9
        if: failure() && steps.vrt.outcome == 'failure'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Collect failed test names from test-results directory
            const testResultsDir = 'test-results';
            const failed = [];
            if (fs.existsSync(testResultsDir)) {
              for (const entry of fs.readdirSync(testResultsDir)) {
                const entryPath = path.join(testResultsDir, entry);
                if (!fs.statSync(entryPath).isDirectory()) continue;
                const diffFile = fs.readdirSync(entryPath)
                  .find(f => f.endsWith('-diff.png'));
                if (diffFile) {
                  failed.push(diffFile.replace('-diff.png', ''));
                }
              }
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const list = failed.length > 0
              ? failed.map(f => `- \`${f}\``).join('\n')
              : '- (see artifacts for details)';

            const body = [
              '## 🔴 VRT Failed',
              '',
              '### Diffs detected',
              list,
              '',
              `📦 [Download diff images](${runUrl}#artifacts)`,
              '',
              '*Artifacts contain actual / expected / diff PNGs for each failure.*',
              '',
              'If these changes are intentional, run:',
              '```bash',
              'pnpm test:vrt:update',
              '```',
            ].join('\n');

            // Update or create comment
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('## 🔴 VRT Failed'));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - uses: actions/github-script@v9
        if: success()
        with:
          script: |
            // Remove previous failure comment if VRT now passes
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('## 🔴 VRT Failed'));
            if (existing) {
              await github.rest.issues.deleteComment({
                ...context.repo,
                comment_id: existing.id,
              });
            }
