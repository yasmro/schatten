# pnpm 10 reads build-script approval from this file. Without it pnpm skips
# package postinstall scripts — including esbuild's, which Storybook / tsup
# rely on. Keeping the list here (rather than package.json#pnpm) stops
# `pnpm install` from appending a duplicate `onlyBuiltDependencies` key back
# into package.json.
onlyBuiltDependencies:
  - esbuild

# Workspace members (#449 Phase 2). The "." entry is load-bearing: changesets
# (@manypkg/get-packages) only treats glob-matched projects as workspace
# packages, so without it `changeset version` fails with "Found changeset …
# which is not in the workspace" for @yasmro/schatten itself (the root
# package). pnpm resolves `"@yasmro/schatten": "workspace:*"` from apps/* to
# the root via symlink, so the library stays at the repo root — no path
# migration for scripts/CI.
packages:
  - "."
  - "apps/*"
