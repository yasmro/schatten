<!doctype html>
<!-- Pages root router (#502, retargeted in #563). The root belongs to nobody:
     it routes readers to the surface they meant.

     - Old-style Storybook deep links carry `?path=` — send them to
       storybook/ so pre-migration links keep working.
     - Everyone else goes to the public site, which lives in its own repo
       (yasmro/schatten-site) since #563.
     - <noscript> falls back to the public site.

     Deployed to the Pages root by deploy-pages-root.yml. The PR-preview
     workflow (storybook-preview.yml) copies the SAME file to pr/<n>/, so the
     preview tree mirrors production exactly. -->
<meta charset="utf-8">
<title>Schatten</title>
<script>
  var q = location.search;
  location.replace(q.indexOf('path=') !== -1 ? 'storybook/' + q : 'https://yasmro.github.io/schatten-site/');
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://yasmro.github.io/schatten-site/"></noscript>
